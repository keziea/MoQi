appId: com.moqi.reader
productName: 墨栖
copyright: Copyright © 2026 Moqi

directories:
  output: out-app
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - '!**/*.map'

# 不用 asar：避免无签名环境下 asar 完整性校验拒绝加载
asar: false

extraResources:
  - from: build/icon.ico
    to: icon.ico

win:
  icon: build/icon.ico
  # 关掉 electron-builder 自带的 exe 改写，改用 afterPack 自己调 rcedit：
  # 自带实现依赖 winCodeSign 缓存包，包里含 macOS 符号链接，
  # 普通 Windows 账户解压会因「客户端没有所需的特权」失败，导致打包中断。
  # 图标与产品信息由 scripts/after-pack.js 统一写入。
  signAndEditExecutable: false

afterPack: scripts/after-pack.js

npmRebuild: false

# 只打中英文语言包。Electron 默认带 55 个语言包共 41MB，
# 中文用户用不到，砍掉后安装包与绿色版都能压进 Gitee 的 100MB 附件上限。
electronLanguages:
  - zh-CN
  - en-US

# ── Windows 安装器 ──
# 默认的一键安装（oneClick）会把程序直接塞进
# C:\Users\<用户名>\AppData\Local\Programs\moqi-reader，
# 用户既不能选装到哪个盘，也找不到装哪去了。
# 这里改成标准安装向导：可以选目录、选文件夹名，装完再创建快捷方式。
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 墨栖
  # 产物直接叫 Moqi-0.4.1-Setup.exe，省掉手工改名，也保证与 README 链接一致
  artifactName: Moqi-${version}-Setup.${ext}
  # 卸载时保留 %APPDATA%\moqi-reader —— 进度、笔记、统计都在里面，不能跟着程序一起删
  deleteAppDataOnUninstall: false
