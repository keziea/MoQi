appId: com.moqi.reader
productName: 墨栖
copyright: Copyright © 2026 Moqi

directories:
  output: out-app
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - '!**/*.map'

# 不用 asar：避免无签名环境下 asar 完整性校验拒绝加载
asar: false

extraResources:
  - from: build/icon.ico
    to: icon.ico

win:
  icon: build/icon.ico
  signAndEditExecutable: false

npmRebuild: false

# 只打中英文语言包。Electron 默认带 55 个语言包共 41MB，
# 中文用户用不到，砍掉后安装包与绿色版都能压进 Gitee 的 100MB 附件上限。
electronLanguages:
  - zh-CN
  - en-US
