name: 发布安装包

# 本工作流只做一件事：把仓库 release/ 目录里已经打好的安装包，
# 发布到 GitHub Releases，供别人点开就下载。
# 不做编译、不做打包，所以不会受 electron-builder 在 CI 上的问题影响。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 取出仓库文件
        uses: actions/checkout@v4

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          name: 墨栖 ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            ## 下载哪一个？

            | 你的情况 | 下这个 |
            |---|---|
            | **想装到电脑上长期用（推荐）** | `Moqi-0.3.0-Setup.exe` — 双击，一直点「下一步」 |
            | **不想安装，解压就想用** | `Moqi-0.3.0-portable.7z` — 用 WinRAR / 7-Zip / Bandizip 解压，双击里面的「墨栖.exe」 |

            > 解压版**不要**放在中文名字的文件夹里（例如「我的书」），否则可能打不开。
            > 放到 `D:\Moqi` 这种纯英文路径最稳。

            ## 第一次用，三步就会

            1. 双击打开软件
            2. 把书（EPUB / MOBI / PDF / TXT）**直接拖进窗口**，或点右上角「导入书籍」
            3. 点书的封面 → 点「阅读」

            软件不联网、不需要注册，书和笔记都只存在你自己电脑里。
          files: |
            release/Moqi-0.3.0-Setup.exe
            release/Moqi-0.3.0-portable.7z
