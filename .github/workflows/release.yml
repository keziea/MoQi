name: 发布安装包

# 本工作流只做一件事：把仓库 release/ 目录里已经打好的安装包，
# 发布到 GitHub Releases，供别人点开就下载。
# 不做编译、不做打包，所以不会受 electron-builder 在 CI 上的问题影响。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 取出仓库文件
        uses: actions/checkout@v4

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          name: 墨栖 ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          # 说明文字直接取 docs/releases/v<版本>.md，保证仓库、GitHub、Gitee 三处逐字相同。
          # 文件不存在时这一步会失败 —— 正好逼着发版前先把发布说明写好。
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            release/Moqi-*-Setup.exe
            release/Moqi-*-portable.7z
